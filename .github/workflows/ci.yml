name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["18.17.0", "20.x", "22.x", "24.x"]
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - name: Install dependencies
        run: npm ci
      - name: Test
        run: npm test
      - name: Packed install — the published command must verify a scaffolded repository
        run: |
          npm run pack
          VERSION="$(node -p "require('./package.json').version")"
          PREFIX="$(mktemp -d)"
          TARGET="$(mktemp -d)"
          npm install --global --prefix "$PREFIX" "$PWD/contract-graph-${VERSION}.tgz"
          test "$("$PREFIX/bin/cg" --version)" = "$VERSION"
          "$PREFIX/bin/cg" init "$TARGET"
          "$PREFIX/bin/cg" sync "$TARGET"
          "$PREFIX/bin/cg" verify "$TARGET"
          "$PREFIX/bin/cg" sync "$TARGET" --check
