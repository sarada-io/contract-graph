name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ["18.x", "20.x", "22.x"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - name: Test
        run: node --test "test/**/*.test.js"
      - name: Self-check — a scaffolded repository must verify green
        run: |
          TARGET="$(mktemp -d)"
          node bin/cg.js init "$TARGET" --design saas,ux,ops
          node bin/cg.js sync "$TARGET"
          node bin/cg.js verify "$TARGET"
          node bin/cg.js sync "$TARGET" --check
