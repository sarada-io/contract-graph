$schema: https://contractgraph.dev/schema/principles-v1.schema.json
principlesVersion: "1.0"
family: engineering
binding: advisory

# This catalog is the shipped engineering SHOULD family. Its entries inform an engineering
# decision, but they do not override repository choices and cg verify does not enforce them.
# The package ships a populated catalog; repositories may deliberately amend or retire its entries.
#
# Each entry is id, statement, and reason. The statement is the practice. The reason is why
# it exists: the concrete failure or maintenance cost it addresses. A
# statement without a reason is a preference, and a later session cannot tell why it should
# follow it.
#
# The sole built-in structural authority is .agents/cg/principles/architecture.yaml. A practice moves
# there only when it is narrowed to one structural invariant, has a deterministic measure, a
# blocking detector registered by the installed verifier, and a fail-on-demand fixture. The
# verifier-owning change assigns the next permanent A ID and removes the source practice
# from this file in the same change; an adopting repository does not create built-in
# enforcement by editing YAML alone.
#
# E never appears in enforcement.yaml. A lives in principles/architecture.yaml.
# Each statement is a conditional recommendation. Reading E does not create acceptance criteria,
# required changes, compliance exceptions, or blockers. Binding adoption is a separate decision.
#
# The pattern is recursive: repository → module → sub-module → component or library →
# implementation. At every level, contract.yaml records a boundary's responsibility, declared
# surface, graph position, routes, and verification. It does not prescribe a source filename
# or internal source layout. The recursive mapping itself — kinds, self-sufficiency, declared
# surface, encapsulation, stay / add-child / elsewhere, and adapters — lives in .agents/cg/principles/architecture.yaml `hierarchy` and `graph`, not here.
#
# These practices cover choices broader than the contract graph. They remain repository
# choices unless promoted into the structural binding catalog with working enforcement.

categories:
  - Structural Best Practices
  - Broader Engineering Considerations

principles:
  - id: E01
    title: Declared-surface consumption
    category: Structural Best Practices
    # Enter, service, encapsulate, and bypass live in principles/architecture.yaml graph.surface.
    # These entries are the caller remainder until import and compatibility detectors exist.
    entries:
      - id: E01-01
        statement: "When consuming another boundary, prefer checking calls and imports against its declared paths, symbols, and types."
        reason: "Caller review can expose implementation bypasses that declaration-only graph checks cannot detect."
      - id: E01-02
        statement: "When changing a declared surface, prefer preserving compatibility or updating affected callers in the same change."
        reason: "Uncoordinated surface changes can break callers even when every contract remains valid."

      - id: E01-03
        statement: Prefer a small, cohesive set of entry operations; a service facade is one option when it makes a scattered implementation easier to consume.
        reason: A discoverable entry surface can reduce caller knowledge of implementation layout without requiring classes or a fixed type count.
        cost: A facade adds an abstraction and forwarding code that simple functions or event interfaces may not need.

  - id: E02
    title: Construction
    category: Structural Best Practices
    # How implementations are assembled. Calls use the declared surface, independently of assembly.
    # What the surface hides is graph.surface.encapsulate. Optional vendor children and
    # consumer-specific adapters are graph.adapters.
    # These entries do not decide nodes.
    entries:
      - id: E02-01
        statement: "For required runtime dependencies, prefer explicit constructors, parameters, or equivalent language mechanisms."
        reason: "Explicit dependencies make assembly and substitution visible at the use boundary."
      - id: E02-02
        statement: "Prefer explicit dependency supply over service locators, hidden registries, and mutable globals."
        reason: "Runtime lookup can conceal dependencies, make initialization order significant, and complicate isolated tests."
      - id: E02-03
        statement: "For long-lived runtime dependencies, prefer named bootstrap or composition roots; construct local values where they are used."
        reason: "Centralized runtime assembly makes implementation selection inspectable without forcing ordinary object creation into bootstrap code."
      - id: E02-04
        statement: "For domain logic that uses time, filesystem, randomness, process, network, or persistence, prefer explicitly supplied ports or functions."
        reason: "Substitutable side effects support deterministic tests and make external interactions visible even with one production implementation."
      - id: E02-05
        statement: "For behavior shared across boundaries, prefer object composition over class inheritance."
        reason: "Composition can expose dependencies without coupling callers to inherited implementation details."

      - id: E02-06
        statement: For interchangeable vendors or consumer-specific behavior, prefer separate adapters behind a consumer-independent port; create child contracts only when the adapters own distinct responsibilities.
        reason: Adapter separation can contain implementation differences without making vendor count a rule for contract decomposition.
        cost: Ports and adapters add interfaces and maintenance work even when the implementations are small.

  - id: E03
    title: Boundary confinement
    category: Structural Best Practices
    # A confinement policy may combine language visibility, package exports,
    # build-system controls, and import-boundary detectors. Public and internal code may be co-located;
    # directory placement alone neither establishes nor violates a boundary.
    entries:
      - id: E03-01
        statement: "For each implementation environment, prefer documenting the mechanisms used to confine access to declared surfaces."
        reason: "A named policy makes the selected language, package, and build controls discoverable; mixed environments may need different mechanisms."
      - id: E03-02
        statement: "Prefer recording which boundaries each confinement mechanism covers and which accesses remain unchecked."
        reason: "Explicit coverage prevents a partial control from being mistaken for repository-wide confinement."
      - id: E03-03
        statement: "Where available, prefer language visibility, package exports, or build controls that reject undeclared cross-boundary access."
        reason: "Native controls can prevent bypass before code runs and reduce reliance on reviewer memory."
      - id: E03-04
        statement: "Where native controls leave gaps, consider an import-boundary detector with a bypass fixture and a declared integration point."
        reason: "An executable detector can expose accesses that declaration-only graph verification misses; adopting its blocking behavior is a separate repository decision."

  - id: E04
    title: Verification quality and generated artifacts
    category: Structural Best Practices
    # Declaring verification and reciprocity live in the contract schema and A12.
    # Same-change contract updates live in graph.stay and produce. These entries do not restate those.
    entries:
      - id: E04-01
        statement: "Prefer the smallest verification command that adequately exercises the invariant; retain integration or repository gates when needed."
        reason: "Focused evidence helps locate defects, while broader checks can expose interactions that local checks miss."
      - id: E04-02
        statement: "Prefer tests that exercise the observable guarantees of the declared surface."
        reason: "Internal tests alone can pass while behavior relied on by callers is broken."
      - id: E04-03
        statement: "For shared or generated artifacts, prefer one accountable owning boundary and explicit consumer references."
        reason: "A clear owner makes source changes and coordination routable even when several tools produce the output."
      - id: E04-04
        statement: "For generated artifacts, prefer changes through the owning source or generator and a reproducible regeneration check."
        reason: "Direct output edits can disappear during regeneration or diverge from the source used by later builds."

  - id: E05
    title: Permitted stores and infrastructure
    category: Broader Engineering Considerations
    # Permission for a store or service to exist. Construction of ports is E02. Optional vendor
    # nodes are graph.adapters. Data-set ownership is E07. A measured requirement
    # to add infrastructure is E08-03. These entries do not decide nodes.
    entries:
      - id: E05-01
        statement: "When infrastructure choices need repository-wide coordination, prefer a maintained inventory or closed allowlist of permitted services."
        reason: "An explicit inventory exposes operational dependencies and helps reviewers assess new infrastructure."
      - id: E05-02
        statement: "Prefer documenting each infrastructure resource's operational purposes and the boundaries that own its datasets or uses."
        reason: "A shared resource can serve several responsibilities without making it their domain owner."
      - id: E05-03
        statement: "When adding infrastructure changes a boundary, dependency, or operational promise, prefer recording the decision and amending affected contracts."
        reason: "Recorded impact helps future changes account for the resource's ownership and operating obligations."

  - id: E06
    title: Reuse and shared capabilities
    category: Broader Engineering Considerations
    entries:
      - id: E06-01
        statement: "Prefer keeping code local until a shared responsibility is supported by evidence."
        reason: "Premature extraction can add coordination and indirection without a stable shared purpose."
      - id: E06-02
        statement: "Before extraction, prefer evidence from current consumers; two consumers are useful evidence, not a prerequisite for a deliberately reusable library."
        reason: "Actual usage tests an abstraction, while a documented independent library purpose can justify an earlier boundary."
      - id: E06-03
        statement: "Prefer extracting only the consumer-independent responsibility shared by the intended consumers."
        reason: "Combining unrelated needs behind one interface creates coupling that similarity alone does not justify."
      - id: E06-04
        statement: "For reusable capabilities, prefer a surface understandable without naming a consuming module."
        reason: "Consumer-independent concepts make the library's promise clearer to new callers."
      - id: E06-05
        statement: "Prefer keeping reusable capabilities independent of their consuming modules."
        reason: "A dependency back to a consumer restricts reuse and may create a cycle already rejected by A09 when declared."
      - id: E06-06
        statement: "When similar code is found, prefer comparing responsibilities and change reasons before extracting it."
        reason: "Similar syntax can implement unrelated promises that should evolve independently."

  - id: E07
    title: Persistence ownership and evolution
    category: Broader Engineering Considerations
    # Data-set ownership and schema evolution. Optional vendor adapters are
    # evaluated through graph.adapters when they own a distinct responsibility.
    # Whether a store may exist is E05.
    entries:
      - id: E07-01
        statement: "For each persisted dataset, prefer one boundary accountable for its schema and business invariants."
        reason: "An accountable owner gives schema changes a clear destination even when storage infrastructure is shared."
      - id: E07-02
        statement: "Prefer routing writes through the boundary accountable for the dataset's invariants; multiple authorized processes or replicas may implement that boundary."
        reason: "One logical write authority avoids competing invariant definitions without prescribing one physical writer."
      - id: E07-03
        statement: "Prefer keeping persistence models, queries, and migrations internal unless storage representation is explicitly part of the boundary's promise."
        reason: "Unintentional exposure couples callers to storage changes; a storage-oriented API may deliberately promise those representations."
      - id: E07-04
        statement: "Prefer sharing connection and transport mechanics separately from domain-specific persistence behavior."
        reason: "Infrastructure reuse need not couple unrelated business schemas or queries."
      - id: E07-05
        statement: "When data infrastructure is shared, prefer leaving business-data ownership with named domain boundaries."
        reason: "Shared execution or hosting does not determine who is responsible for business invariants."
      - id: E07-06
        statement: "Before introducing a generic store abstraction, prefer identifying the common semantics and preserving each domain's ownership and access rules."
        reason: "A generic interface can conceal important differences if it is based only on similar CRUD syntax."
      - id: E07-07
        statement: "Prefer introducing a persistence abstraction when a concrete persistence requirement or substitution need justifies it."
        reason: "Speculative storage abstractions create interfaces and maintenance work without a demonstrated consumer."
      - id: E07-08
        statement: "When persisted data outlives its writer version, prefer an explicit format-identification strategy using record, envelope, or dataset schema versions."
        reason: "Readers need a reliable way to determine which format they received; a per-record integer schemaVersion is one option."
      - id: E07-09
        statement: "Prefer documenting which format versions each writer emits, including compatibility periods during rolling upgrades."
        reason: "An explicit writer policy makes mixed-version deployment and reader compatibility assessable."
      - id: E07-10
        statement: "Prefer a declared support window for persisted formats with executable reader compatibility checks."
        reason: "Readers need an explicit policy for which historical formats they accept."
      - id: E07-11
        statement: "For supported older formats, prefer an explicit conversion strategy such as reader upcasting or managed migration."
        reason: "A defined conversion boundary limits the spread of historical representations through application code."
      - id: E07-12
        statement: "For unsupported formats, prefer an explicit error or quarantine path rather than guessing their interpretation."
        reason: "Visible rejection avoids treating incompatible data as valid current records."
      - id: E07-13
        statement: "Before removing format support, prefer proving that remaining data and active writers no longer require it, or recording an explicit archival or rejection policy."
        reason: "Removing a reader path can make retained data inaccessible even when current tests pass."

  - id: E08
    title: Deployment and runtime simplicity
    category: Broader Engineering Considerations
    # Deployable count and measured infrastructure. Allowlisting a new store or
    # service is E05; this family does not own that amendment.
    entries:
      - id: E08-01
        statement: "When deployment needs are not yet distinct, prefer fewer deployables."
        reason: "Each independently operated unit adds release and operational coordination."
      - id: E08-02
        statement: "Before adding a deployable, prefer identifying the scaling, availability, isolation, or release need it serves."
        reason: "Deployment boundaries should follow operating needs and need not match contract boundaries one for one."
      - id: E08-03
        statement: "Before adding infrastructure, prefer a measured requirement or a documented constraint that existing resources cannot satisfy."
        reason: "Evidence makes the extra operational dependency and its cost reviewable."
      - id: E08-04
        statement: "Prefer documenting runtime request paths from declared entry points to side-effecting operations, with assembly locations identified separately."
        reason: "Execution flow and bootstrap assembly answer different questions; both help locate behavior without implying that requests execute through bootstrap code."

  - id: E09
    title: Safety and authorization
    category: Broader Engineering Considerations
    entries:
      - id: E09-01
        statement: "For authorization at untrusted-input boundaries, prefer deterministic policy evaluation over model-generated permission."
        reason: "A repeatable decision can be tested against explicit grants and denial cases."
      - id: E09-02
        statement: "When models classify input, prefer separating that classification from the authority to execute an action."
        reason: "Classification output can be mistaken or manipulated and should not itself create permission."
      - id: E09-03
        statement: "For protected actions, prefer a named enforcement path through which all relevant execution routes pass."
        reason: "Explicit coverage makes alternate routes and missing checks easier to review."
      - id: E09-04
        statement: "When defining authorization policy, prefer an explicit default-deny rule for actions without a matching grant."
        reason: "A missing grant then has a defined result rather than depending on incidental code behavior."
      - id: E09-05
        statement: "When an authorization check errors, times out, or returns an unknown result, prefer denying the protected operation."
        reason: "Failure to determine permission does not establish permission; this is distinct from the no-grant case in E09-04."
      - id: E09-06
        statement: "Prefer naming the boundary accountable for authorization policy and the resource owner that supplies its semantics."
        reason: "Evaluation may be centralized, but policy responsibility and resource-specific meaning should remain explicit."
      - id: E09-07
        statement: "Prefer enforcing authorization in the trusted execution path independently of UI, prompt, and client checks."
        reason: "A caller can bypass presentation-layer checks without bypassing a correctly integrated execution gate."
      - id: E09-08
        statement: "For consequential actions, prefer an explicit policy defining when confirmation is needed and what prior authorization it accepts."
        reason: "Action-specific policy avoids both accidental execution and repeated confirmation of work already authorized."
      - id: E09-09
        statement: "When confirmation is required, prefer binding it to the action, target, and relevant parameters."
        reason: "A grant for one action should not accidentally authorize a different request."
      - id: E09-10
        statement: "For single-use confirmations, prefer recording consumption and defining retry behavior separately."
        reason: "Replay prevention and safe retries need compatible semantics to avoid duplicate effects or unusable recovery."
      - id: E09-11
        statement: "When accepting client-submitted confirmation, prefer verifying its authenticity and binding in the trusted execution path."
        reason: "The client may transport evidence, but an unverified client assertion does not establish authorization."

  - id: E10
    title: Sensitive-data lifecycle
    category: Broader Engineering Considerations
    entries:
      - id: E10-01
        statement: "When subject-data removal is part of the product's obligations, prefer a defined erasure operation with explicit scope and exclusions."
        reason: "A named operation makes removal responsibilities and completion criteria discoverable."
      - id: E10-02
        statement: "When subject erasure and account closure have different effects, prefer modeling their scopes separately."
        reason: "Explicit scopes reduce accidental deletion and clarify which retained records or identities remain."
      - id: E10-03
        statement: "For account removal, prefer authorization appropriate to the product's ownership model and the action's consequences."
        reason: "Deletion rights need to be evaluated for the affected account and actor."
      - id: E10-04
        statement: "For account removal, prefer an audit record identifying the actor or service identity, authority, target, and outcome."
        reason: "An attributable record supports investigation and recovery without assuming every action is interactive."
      - id: E10-05
        statement: "For scheduled account removal, prefer an explicit service identity, authorization policy, and auditable eligibility criteria."
        reason: "Automation can be authorized; recording why an account qualified makes the action accountable."
      - id: E10-06
        statement: "For customer-initiated account removal, prefer a trusted execution path that verifies ownership and applies the product's confirmation policy."
        reason: "Self-service removal can be legitimate when the execution boundary verifies the request."
      - id: E10-07
        statement: "For subject-data operations, prefer a stable subject identifier with documented mappings to other stored identities."
        reason: "Explicit mappings help locate subject data across systems without assuming one identity representation fits every store."
      - id: E10-08
        statement: "For an erasure workflow, prefer an inventory of participating stores and declared exclusions."
        reason: "Known coverage makes completion assessable without claiming discovery of every possible copy."
      - id: E10-09
        statement: "Before declaring erasure complete, prefer verifying removal against the declared scope and recording unresolved stores or exceptions."
        reason: "A deletion request alone does not establish that all participating stores completed it."
      - id: E10-10
        statement: "Prefer distinguishing an erasure request receipt from a verified completion receipt."
        reason: "Callers can then tell acceptance from completion and see unresolved work."
      - id: E10-11
        statement: "For retained record classes, prefer documenting retention periods, owners, and applicable exceptions."
        reason: "Explicit lifecycle decisions prevent accidental indefinite retention."
      - id: E10-12
        statement: "Where retention is adopted, prefer an automated enforcement mechanism with checks that it runs successfully."
        reason: "A schedule or TTL setting alone does not prove that the intended records are removed."
      - id: E10-13
        statement: "Prefer excluding raw secrets from source control, telemetry, and ordinary business records; keep necessary credential material in designated secret storage."
        reason: "Limiting credential copies reduces exposure through clones, logs, and backups."
      - id: E10-14
        statement: "Where runtime secret resolution is supported, prefer secret references over embedding resolved values in ordinary configuration."
        reason: "References separate deployable configuration from sensitive credential material."
      - id: E10-15
        statement: "Before sending telemetry, prefer minimizing or redacting customer content and identifying information according to the adopted data policy."
        reason: "Telemetry can introduce additional storage, readers, and retention beyond the original operation."

  - id: E11
    title: Runtime configuration
    category: Broader Engineering Considerations
    entries:
      - id: E11-01
        statement: "Prefer runtime configuration when a value needs to change independently of deployment and its operating cost is justified."
        reason: "Configuration adds a second change path that needs validation and ownership."
      - id: E11-02
        statement: "Prefer classifying runtime configuration by its actual purpose and risk rather than restricting it to a fixed list of categories."
        reason: "Operational settings vary by product; explicit classification is more informative than an arbitrary universal list."
      - id: E11-03
        statement: "Prefer keeping ordinary control flow in code unless a managed rules or workflow system is an intentional product capability."
        reason: "An intentional configuration language needs explicit semantics and testing rather than accidental logic spread across flags."
      - id: E11-04
        statement: "For configurable authorization or safety policy, prefer controlled changes, validation, versioning, and enforcement tests."
        reason: "Code and configuration can both express policy; correctness depends on the change controls and execution path."
      - id: E11-05
        statement: "Prefer an enumerable inventory of runtime configuration keys and effective values, with secrets redacted."
        reason: "Operators and reviewers need to discover which settings affect running behavior."
      - id: E11-06
        statement: "Prefer rejecting unknown configuration keys unless an explicit extension mechanism defines their ownership and validation."
        reason: "Unexpected keys can hide typos or behavior outside the declared configuration contract."
      - id: E11-07
        statement: "Prefer assigning one accountable owner to each runtime configuration key."
        reason: "An owner provides a destination for changes, incidents, and retirement decisions."
      - id: E11-08
        statement: "Prefer validating runtime configuration values before activation."
        reason: "Validation catches unsupported values before they alter running behavior."
      - id: E11-09
        statement: "For consequential configuration changes, prefer an attributable audit trail."
        reason: "Recorded changes help explain incidents and distinguish authorized operations from drift."
      - id: E11-10
        statement: "Where concurrent updates or rollback matter, prefer revisioned configuration with explicit conflict handling."
        reason: "A revision can identify active settings and prevent silent overwrite when used by the update path."
      - id: E11-11
        statement: "Prefer defining behavior for missing or invalid configuration; reject operations when a fallback would violate required correctness or authorization."
        reason: "Explicit failure behavior avoids accidental unsafe defaults while permitting safe degradation."
      - id: E11-12
        statement: "Prefer documenting one coherent purpose for each configuration key, separately from its accountable owner in E11-07."
        reason: "Combining unrelated behaviors under one setting couples changes that may need independent control."

  - id: E12
    title: Product shape
    category: Broader Engineering Considerations
    entries:
      - id: E12-01
        statement: "When an adopted configuration surface can express the change, consider configuration before structural changes, using the relevant safeguards in E11."
        reason: "A maintained configuration interface can support a change without unnecessary restructuring."
        cost: "The relevant configuration safeguards add implementation and operating work."
      - id: E12-02
        statement: "For a product operated by a small team, prefer scope and operating complexity that the team can maintain."
        reason: "Additional product variants increase support and coordination work and should serve an identified need."
        cost: "A narrower offering may defer customer segments or features that need additional operating capacity."

  - id: E13
    title: Isolation and scope
    category: Broader Engineering Considerations
    entries:
      - id: E13-01
        statement: "Where practical, prefer APIs or storage boundaries that make omitted scope invalid by construction."
        reason: "Structural scope checks reduce reliance on every caller remembering a filtering predicate."
        cost: "Scope-aware APIs can require refactoring construction and call sites when the scope model changes."
      - id: E13-02
        statement: "When scope affects correctness or authorization, prefer explicit scope parameters over implicit ambient lookup."
        reason: "Explicit scope makes the request context inspectable and easier to test."
        cost: "Explicit context can widen signatures and add forwarding code."
      - id: E13-03
        statement: "When administrative and customer tasks share semantics and access controls can remain clear, consider one implementation with appropriately separated views."
        reason: "Shared implementation can reduce drift; separate surfaces may still be appropriate for different risks or workflows."
        cost: "Shared implementation needs explicit privilege separation and may complicate each view."

  - id: E14
    title: Doing less
    category: Broader Engineering Considerations
    entries:
      - id: E14-01
        statement: "Prefer eliminating unnecessary work before optimizing it when the required behavior can be preserved or deliberately amended."
        reason: "Removing redundant operations reduces both runtime cost and maintenance work."
        cost: "Removing work may require revisiting behavior or demonstrating that the operation was redundant."
      - id: E14-02
        statement: "When considering a cache, prefer an explicit freshness and invalidation strategy over speed alone."
        reason: "Undefined freshness can return stale results even when the cache performs well."
        cost: "Freshness tracking and invalidation add coordination that an uncached design may avoid."

  - id: E15
    title: What you charge for
    category: Broader Engineering Considerations
    entries:
      - id: E15-01
        statement: "For billing, prefer metering the unit defined by the product's commercial promise."
        reason: "A mismatch between measured events and the sold unit can produce confusing or incorrect charges."
        cost: "The sold unit may require aggregation and reconciliation across several events."
      - id: E15-02
        statement: "At commercial limits, consider a documented degraded service when it preserves contractual, correctness, and authorization requirements; otherwise reject the operation explicitly."
        reason: "A designed limit response is clearer than an accidental outage or an unsafe fallback."
        cost: "A degraded path adds behavior that needs documentation and verification."
      - id: E15-03
        statement: "On customer-facing billing surfaces, prefer product units over incidental internal cost mechanics unless those mechanics are part of the offering."
        reason: "Stable product concepts reduce coupling between pricing communication and implementation changes."
        cost: Two vocabularies for one quantity require a translation that can drift.

  - id: E16
    title: Reversibility and simplicity
    category: Broader Engineering Considerations
    entries:
      - id: E16-01
        statement: "When options meet the same requirements, prefer lower rollback and migration cost."
        reason: "Reversible choices reduce the cost of correcting an assumption after new evidence arrives."
        cost: A bounded reversible intermediate may defer an otherwise cleaner end state.
      - id: E16-02
        statement: "When responsibilities and required isolation are preserved, prefer fewer seams, writers, credentials, and operational components."
        reason: "Each additional dependency or control creates coordination and maintenance work; reducing count should not erase necessary boundaries."
        cost: "Fewer components can reduce independent deployment or replacement flexibility."

  - id: E17
    title: Runtime degradation
    category: Broader Engineering Considerations
    entries:
      - id: E17-01
        statement: "For invalid input or a local failure, consider visible degraded operation only when it preserves required correctness and authorization; otherwise reject the operation."
        reason: "A fallback can preserve availability, but a successful-looking result must not conceal a violated requirement."
        cost: "Fallbacks add behavior and observability work and can conceal defects if their use is invisible."

  - id: E18
    title: Defaults under uncertainty
    category: Broader Engineering Considerations
    entries:
      - id: E18-01
        statement: "When a required check cannot establish correctness or authorization, prefer rejecting the affected operation; E09-05 covers authorization-check failures."
        reason: "Uncertainty about a required precondition is not evidence that it holds; optional failures can use the safe degradation described in E17-01."
        cost: "Failure of a required check can make the affected operation unavailable."
      - id: E18-02
        statement: "When comparing isolation options, consider the impact of one control failing as well as perimeter strength."
        reason: "Limiting propagation can reduce the consequences of a missed check or compromised component."
        cost: "Partitioning can duplicate state and operational controls."
      - id: E18-03
        statement: "Where renewal infrastructure is reliable, prefer short-lived credentials over indefinite credentials that rely on manual rotation."
        reason: "Expiry limits the useful lifetime of exposed credentials but introduces a renewal dependency."
        cost: Short-lived credentials need issuing infrastructure and a renewal path that can fail.

  - id: E19
    title: Grants and evidence
    category: Broader Engineering Considerations
    entries:
      - id: E19-01
        statement: "For authorization policy, prefer explicit grants naming the permitted action and resource scope."
        reason: "Named grants make policy review and unintended privilege easier to reason about."
        cost: "Explicit grant definitions add policy maintenance as supported actions change."
      - id: E19-02
        statement: "For audit evidence, prefer records containing the actor, relevant authority, action, target, and outcome, subject to data minimization."
        reason: "Retention duration alone does not make a record sufficient to reconstruct a decision."
        cost: "Useful evidence adds capture, storage, access-control, and minimization work."

  - id: E20
    title: Trust boundaries
    category: Broader Engineering Considerations
    entries:
      - id: E20-01
        statement: "At a trust boundary, prefer validating the inputs and authorization assumptions relied on by the receiving component."
        reason: "Checks performed by another component may cover different assumptions or be bypassed by another caller."
        cost: "Receiving-side validation can duplicate work and add latency."
      - id: E20-02
        statement: "When identifier enumeration creates exposure, consider opaque external identifiers while retaining authorization checks on every access."
        reason: "Identifier opacity can reduce information disclosure but does not itself establish access rights."
        cost: "Opaque identifiers may add generation, resolution, and mapping lifecycle work."
      - id: E20-03
        statement: "When an identifier must carry verifiable claims across a trust boundary, consider integrity protection with explicit scope and expiry."
        reason: "Integrity protection can detect altered claims; it does not replace authorization or replay handling."
        cost: "Integrity protection adds verification work and key or token lifecycle management."

  - id: E21
    title: Guarantees owned by the application
    category: Broader Engineering Considerations
    entries:
      - id: E21-01
        statement: "When a required control is implemented entirely by the application, prefer documenting that ownership and the checks that exercise it."
        reason: "Naming the actual enforcement layer avoids attributing guarantees to a platform that does not provide them."
        cost: "The application owner must maintain the evidence needed for the adopted control; critical controls may need blocking tests."

  - id: E22
    title: The surface carries the task
    category: Broader Engineering Considerations
    entries:
      - id: E22-01
        statement: "For a user task, prefer keeping necessary context and actions discoverable from its starting surface."
        reason: "Unnecessary navigation can make a coherent task harder to complete without implying each screen is a contract node."
        cost: "A consolidated task surface may need more presentation logic and integrations."
      - id: E22-02
        statement: "When a result cannot be established, prefer stating the limitation and offering a valid next step over presenting a plausible guess as fact."
        reason: "Users need to distinguish verified results from incomplete or uncertain work."
        cost: "An incomplete-result state needs clear explanation and a useful recovery path."

  - id: E23
    title: Perceived responsiveness
    category: Broader Engineering Considerations
    entries:
      - id: E23-01
        statement: "For interactive paths, prefer explicit latency objectives and measured tail behavior over average latency alone."
        reason: "Tail measurements expose slow experiences that an average hides; they do not establish a mathematical worst-case bound."
        cost: "Improving tail latency may reduce throughput or require additional capacity."
      - id: E23-02
        statement: "Before optimizing a path, prefer measuring where its time and resources are spent."
        reason: "Measurement helps target the operation responsible for the observed delay."
        cost: "Instrumentation and analysis take time and may confirm rather than change the initial diagnosis."
      - id: E23-03
        statement: "For queues, pools, and payloads, prefer explicit bounds and defined behavior at those bounds."
        reason: "A bounded resource turns uncontrolled growth into an observable admission or rejection decision."
        cost: "Bounds require a defined rejection, backpressure, or retry response."
