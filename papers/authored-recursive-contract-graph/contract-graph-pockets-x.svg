<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 630" width="920" height="630" role="img">
  <title>Contract Graph composition spine</title>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#334155"/>
    </marker>
    <marker id="arrWalk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#c2410c"/>
    </marker>
    <marker id="arrUses" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="920" height="630" fill="#ffffff"/>

  <text x="20" y="26" font-family="Helvetica, Arial, sans-serif" font-size="16" font-weight="700" fill="#0f172a">Contract Graph</text>
  <text x="20" y="46" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#475569">Composition spine. Nested boxes are pockets. Nodes are contracts. Arrows are routes. Depth is mixed.</text>

  <rect x="16" y="56" width="888" height="506" rx="6" fill="#f8fafc" stroke="#0f172a" stroke-width="1.6"/>
  <text x="32" y="78" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Project</text>

  <rect x="32" y="92" width="100" height="40" rx="3" fill="#ffffff" stroke="#64748b" stroke-width="1.2"/>
  <text x="52" y="117" font-family="Helvetica, Arial, sans-serif" font-size="13" fill="#0f172a">request</text>
  <circle cx="44" cy="100" r="8" fill="#c2410c"/>
  <text x="41" y="104" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">1</text>

  <line x1="132" y1="112" x2="168" y2="112" stroke="#c2410c" stroke-width="2.2" marker-end="url(#arrWalk)"/>

  <rect x="176" y="86" width="200" height="52" rx="3" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text x="196" y="108" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Project contract</text>
  <text x="196" y="126" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">routes the task</text>
  <circle cx="188" cy="94" r="8" fill="#c2410c"/>
  <text x="185" y="98" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">2</text>

  <path d="M 240 138 L 200 164" fill="none" stroke="#c2410c" stroke-width="2.2" marker-end="url(#arrWalk)"/>
  <path d="M 320 138 L 640 164" fill="none" stroke="#94a3b8" stroke-width="1.6" marker-end="url(#arr)"/>
  <text x="248" y="150" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a" stroke="#ffffff" stroke-width="3" paint-order="stroke">compose</text>
  <text x="530" y="140" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a" stroke="#ffffff" stroke-width="3" paint-order="stroke">compose</text>

  <!-- Module A: stacked walk -->
  <rect x="28" y="168" width="348" height="376" rx="5" fill="#e8f0f6" stroke="#c2410c" stroke-width="1.8"/>
  <text x="44" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Module A</text>
  <text x="124" y="190" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#c2410c">walk continues</text>

  <rect x="44" y="202" width="236" height="40" rx="3" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text x="60" y="227" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Module A contract</text>
  <circle cx="56" cy="210" r="8" fill="#c2410c"/>
  <text x="53" y="214" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">3</text>

  <line x1="162" y1="242" x2="162" y2="266" stroke="#c2410c" stroke-width="2.2" marker-end="url(#arrWalk)"/>
  <text x="176" y="258" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a" stroke="#ffffff" stroke-width="3" paint-order="stroke">compose</text>

  <rect x="44" y="272" width="316" height="256" rx="5" fill="#f8fafc" stroke="#334155" stroke-width="1.3"/>
  <text x="56" y="294" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Sub-module</text>

  <rect x="60" y="306" width="220" height="36" rx="3" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text x="76" y="329" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Sub-module contract</text>
  <circle cx="72" cy="314" r="8" fill="#c2410c"/>
  <text x="69" y="318" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">4</text>

  <line x1="170" y1="342" x2="170" y2="364" stroke="#c2410c" stroke-width="2.2" marker-end="url(#arrWalk)"/>

  <rect x="60" y="370" width="284" height="142" rx="5" fill="#eef4f8" stroke="#334155" stroke-width="1.3"/>
  <text x="72" y="390" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Component / Library</text>

  <rect x="76" y="400" width="252" height="36" rx="3" fill="#ffffff" stroke="#c2410c" stroke-width="2"/>
  <text x="92" y="423" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Component contract</text>
  <circle cx="88" cy="408" r="8" fill="#c2410c"/>
  <text x="85" y="412" font-family="Helvetica, Arial, sans-serif" font-size="10" font-weight="700" fill="#ffffff">5</text>

  <line x1="202" y1="436" x2="202" y2="454" stroke="#c2410c" stroke-width="2.2" marker-end="url(#arrWalk)"/>

  <rect x="76" y="458" width="252" height="40" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.2" stroke-dasharray="5 3"/>
  <text x="92" y="483" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">implementation</text>

  <!-- Module B: splits -->
  <rect x="420" y="168" width="468" height="376" rx="5" fill="#eef4f8" stroke="#334155" stroke-width="1.3"/>
  <text x="436" y="190" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Module B</text>
  <text x="508" y="190" font-family="Helvetica, Arial, sans-serif" font-size="11" fill="#64748b">splits</text>

  <rect x="436" y="202" width="432" height="40" rx="3" fill="#ffffff" stroke="#1e3a5f" stroke-width="1.5"/>
  <text x="452" y="227" font-family="Helvetica, Arial, sans-serif" font-size="13" font-weight="700" fill="#0f172a">Module B contract</text>

  <line x1="544" y1="242" x2="524" y2="266" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>
  <line x1="760" y1="242" x2="780" y2="266" stroke="#334155" stroke-width="1.6" marker-end="url(#arr)"/>

  <rect x="436" y="272" width="212" height="256" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
  <text x="452" y="296" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Sub-module A</text>
  <rect x="452" y="310" width="180" height="44" rx="3" fill="#ffffff" stroke="#1e3a5f" stroke-width="1.3"/>
  <text x="468" y="337" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">SM-A contract</text>
  <line x1="542" y1="354" x2="542" y2="382" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="452" y="390" width="180" height="118" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.1" stroke-dasharray="5 3"/>
  <text x="468" y="448" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">implementation</text>

  <rect x="660" y="272" width="212" height="256" rx="4" fill="#f8fafc" stroke="#334155" stroke-width="1.2"/>
  <text x="676" y="296" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">Sub-module B</text>
  <rect x="676" y="310" width="180" height="44" rx="3" fill="#ffffff" stroke="#1e3a5f" stroke-width="1.3"/>
  <text x="692" y="337" font-family="Helvetica, Arial, sans-serif" font-size="12" font-weight="700" fill="#0f172a">SM-B contract</text>
  <line x1="766" y1="354" x2="766" y2="382" stroke="#334155" stroke-width="1.4" marker-end="url(#arr)"/>
  <rect x="676" y="390" width="180" height="118" rx="3" fill="#f1f5f9" stroke="#64748b" stroke-width="1.1" stroke-dasharray="5 3"/>
  <text x="692" y="448" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">implementation</text>

  <line x1="420" y1="222" x2="376" y2="222" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#arrUses)"/>
  <text x="378" y="210" font-family="Helvetica, Arial, sans-serif" font-size="11" font-weight="700" fill="#0f172a" stroke="#ffffff" stroke-width="3" paint-order="stroke">uses</text>

  <line x1="20" y1="586" x2="64" y2="586" stroke="#334155" stroke-width="1.8" marker-end="url(#arr)"/>
  <text x="72" y="590" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">compose</text>
  <line x1="148" y1="586" x2="192" y2="586" stroke="#64748b" stroke-width="1.6" stroke-dasharray="6 3" marker-end="url(#arrUses)"/>
  <text x="200" y="590" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">uses</text>
  <rect x="252" y="576" width="18" height="14" rx="2" fill="#ffffff" stroke="#1e3a5f"/>
  <text x="276" y="590" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">contract = node</text>
  <rect x="400" y="576" width="18" height="14" rx="2" fill="#f1f5f9" stroke="#64748b" stroke-dasharray="4 2"/>
  <text x="424" y="590" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#334155">implementation = interior</text>
  <line x1="612" y1="586" x2="656" y2="586" stroke="#c2410c" stroke-width="2.2" marker-end="url(#arrWalk)"/>
  <text x="664" y="590" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#c2410c">agent walk 1-5</text>

  <text x="20" y="618" font-family="Helvetica, Arial, sans-serif" font-size="12" fill="#475569">Walk: request -&gt; Project -&gt; Module A -&gt; Sub-module -&gt; Component -&gt; bounded source. Spine, not a pure tree.</text>
</svg>
